[project]
name = "Sigma-AutoSunSpot"
version = "0.0.0"
requires-python = ">=3.13"

[tool.pyright]
extraPaths = ["."]
typeCheckingMode = "basic"
pythonVersion = "3.13"


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]

exclude = [
    "MIN2ver2.py",
]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "PTH",
    "A",
    "ANN",
]
ignore = [
    "E501", # 行長オーバーの警告
]



